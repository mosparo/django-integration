[tox]
envlist =
    py{310}-dj{32,42}
    py{311}-dj{42,50}
    py{312}-dj{42,51,52,60,61,main}
    py{313}-dj{51,52,60,61,main}
    py{314}-dj{52,60,61,main}
    py{315}-dj{61,main}
    lint
skip_missing_interpreters = true

[testenv]
deps =
    dj32: Django>=3.2,<4.0
    dj42: Django>=4.2,<5.0
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
    pytest-runner
    requests-mock
    pytest-django
changedir = {toxinidir}
setenv =
    PYTHONPATH = {toxinidir}
commands =
    pytest tests/ -v {posargs}

[testenv:lint]
deps =
    ruff
changedir = {toxinidir}
commands =
    ruff check --fix --exit-non-zero-on-fix .
