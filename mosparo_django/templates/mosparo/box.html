{% load i18n %}{% translate "The spam protection could not be loaded. The form cannot be submitted. Please reload the page or try again later." as load_error_message %}<div id="mosparo-box-{{ widget_uuid }}"></div>
<script>
  (function() {
    function init() {
      new mosparo("mosparo-box-{{ widget_uuid }}", "{{ mosparo_host }}", "{{ mosparo_uuid }}", "{{ mosparo_public_key }}", {loadCssResource: true});
    }

    function showLoadError() {
      const box = document.getElementById("mosparo-box-{{ widget_uuid }}")
      box.classList.add("mosparo__load-error")
      box.setAttribute("role", "alert")
      box.textContent = "{{ load_error_message|escapejs }}"
    }

    if (typeof mosparo === "undefined") {
      const el = document.createElement("script")
      el.setAttribute("src", "{{ mosparo_host }}/build/mosparo-frontend.js")
      el.addEventListener("load", init)
      el.addEventListener("error", showLoadError)
      document.body.append(el)
    } else if (document.readyState !== "loading") {
      init()
    } else {
      document.addEventListener("DOMContentLoaded", init)
    }
  })()
</script>
